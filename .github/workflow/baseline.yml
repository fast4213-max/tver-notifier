# baseline.yml
# ------------
# 「新しく番組をprograms.jsonに追加したとき」に、最初に1回だけ手動実行するための
# ワークフローです。
#
# 何をするか：
#   その時点で配信されている全エピソードを、Discordに通知せず
#   「既読（もう知っている）」としてseen.jsonに一気に登録します。
#
# なぜ必要か：
#   これを実行せずにいきなり通常の check.yml を回すと、
#   過去に配信されている話数まで全部「新着」とみなされて
#   大量通知されてしまいます。それを防ぐための下準備です。
#
# 使い方：
#   1. data/programs.json に番組を追加してコミットする
#   2. GitHubの Actions タブ → 「TVer Baseline (Initial Setup)」を選ぶ
#   3. 「Run workflow」ボタンを押して手動実行する
#   4. 実行が終わったら、data/seen.json に既読情報が追記されているはず
#   5. 以降は自動実行（check.yml）が新着だけを通知するようになる

name: TVer Baseline (Initial Setup)

on:
  workflow_dispatch: {}

jobs:
  baseline:
    runs-on: ubuntu-latest

    # data/seen.json をコミットして書き戻すために必要な権限
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 初回既読登録スクリプトを実行（Discordには通知しません）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py --mode=baseline

      - name: 既読情報(seen.json)の変更をコミット
        run: |
          git config user.name "tver-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "初回既読登録: seen.jsonを更新"
            git push
          else
            echo "seen.jsonに変更はありませんでした。コミットはスキップします。"
          fi
