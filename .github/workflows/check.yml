# check.yml
# ---------
# このワークフローは「時間になったら自動で動く」設定（schedule）を使いません。
# 代わりに、外部のcronサービス（cron-job.orgなど）から
# GitHubのAPI経由で「repository_dispatch」というイベントを送ってもらい、
# それをきっかけに動く仕組みです。
#
# 送ってもらうリクエストのイメージ：
#   POST https://api.github.com/repos/{あなたのユーザー名}/{リポジトリ名}/dispatches
#   Header: Authorization: token <GitHubトークン>
#   Header: Accept: application/vnd.github+json
#   Body:   {"event_type": "tver-check"}
#
# 上記の event_type と、下の types の値 "tver-check" が一致していることが重要です。

name: TVer Check and Notify

on:
  repository_dispatch:
    types: [tver-check]
  # 動作確認のため、GitHubの画面から手動でも実行できるようにしておきます
  workflow_dispatch: {}

# check.yml と baseline.yml はどちらも seen.json を書き換えてpushするため、
# 同時に走ると後から終わった方のpushが失敗する。同じグループにして直列実行させる。
concurrency:
  group: seen-json-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    # data/seen.json をこのワークフロー自身がコミットして書き戻すために必要な権限
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: TVer通知スクリプトを実行（本番モード）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py --mode=normal

      - name: 既読情報(seen.json)の変更をコミット
        run: |
          git config user.name "tver-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          # 変更が無い場合にコミットしようとするとエラーになるため、
          # 変更があるときだけコミット＆プッシュする
          if ! git diff --cached --quiet; then
            git commit -m "既読エピソード情報を更新"
            # 実行中に main へ別のコミット（programs.json の編集など）が入ると
            # そのままでは push が拒否され、通知済みなのに既読が保存されず
            # 次回また同じ内容が通知されてしまう。最新を取り込んでから再試行する。
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "pushに失敗しました。${i}回目のリトライを待機します..."
              sleep $((i * 5))
            done
            echo "seen.jsonのpushに3回失敗しました。"
            exit 1
          else
            echo "seen.jsonに変更はありませんでした。コミットはスキップします。"
          fi
