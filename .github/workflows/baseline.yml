# baseline.yml
# ------------
# 「新しく番組をprograms.jsonに追加したとき」に、最初に1回だけ手動実行するための
# ワークフローです。
#
# 何をするか：
#   その時点で配信されている全エピソードを、Discordに通知せず
#   「既読（もう知っている）」としてseen.jsonに一気に登録します。
#
# なぜ必要か：
#   これを実行せずにいきなり通常の check.yml を回すと、
#   過去に配信されている話数まで全部「新着」とみなされて
#   大量通知されてしまいます。それを防ぐための下準備です。
#
# 使い方：
#   1. data/programs.json に番組を追加してコミットする
#   2. GitHubの Actions タブ → 「TVer Baseline (Initial Setup)」を選ぶ
#   3. 「Run workflow」ボタンを押して手動実行する
#   4. 実行が終わったら、data/seen.json に既読情報が追記されているはず
#   5. 以降は自動実行（check.yml）が新着だけを通知するようになる

name: TVer Baseline (Initial Setup)

on:
  workflow_dispatch: {}

# check.yml と baseline.yml はどちらも seen.json を書き換えてpushするため、
# 同時に走ると後から終わった方のpushが失敗する。同じグループにして直列実行させる。
concurrency:
  group: seen-json-writer
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest

    # data/seen.json をコミットして書き戻すために必要な権限
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 初回既読登録スクリプトを実行（Discordには通知しません）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py --mode=baseline

      - name: 既読情報(seen.json)の変更をコミット
        run: |
          git config user.name "tver-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "初回既読登録: seen.jsonを更新"
            # 実行中に main へ別のコミット（programs.json の編集など）が入ると
            # そのままでは push が拒否され、通知済みなのに既読が保存されず
            # 次回また同じ内容が通知されてしまう。最新を取り込んでから再試行する。
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "pushに失敗しました。${i}回目のリトライを待機します..."
              sleep $((i * 5))
            done
            echo "seen.jsonのpushに3回失敗しました。"
            exit 1
          else
            echo "seen.jsonに変更はありませんでした。コミットはスキップします。"
          fi
